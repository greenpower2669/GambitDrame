name: Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - proposal/stockfish-multipv-human-training-v1
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GambitDrame-debug.apk
          gh release create "test-${{ github.run_number }}" GambitDrame-debug.apk --prerelease --target "${{ github.sha }}" --title "GambitDrame test ${{ github.run_number }}"
