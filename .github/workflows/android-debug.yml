name: Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - proposal/stockfish-multipv-human-training-v1
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # No android-actions/setup-android@v3: it invokes removed SDK package "tools".
      - name: Verify pure Java chess rules
        run: |
          mkdir -p build/chess-test-classes
          javac -d build/chess-test-classes app/src/main/java/fr/gambitdrame/ChessGame.java app/src/test/java/fr/gambitdrame/ChessGameTest.java
          java -cp build/chess-test-classes fr.gambitdrame.ChessGameTest
      - name: Prepare SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK (pre-release on work branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GambitDrame-v0.2.0-debug.apk
          tag="gd-test-${{ github.run_number }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" GambitDrame-v0.2.0-debug.apk --clobber
          else
            gh release create "$tag" GambitDrame-v0.2.0-debug.apk --target "${{ github.sha }}" --prerelease --title "GambitDrame 0.2.0 test ${{ github.run_number }}" --notes "Prototype hors ligne : règles légales, bot de démonstration NON calibré. Stockfish/Lichess non intégrés. Pas de fusion main."
          fi
