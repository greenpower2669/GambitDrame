name: GambitDrame Android + Stockfish 18 ARM64
on:
  workflow_dispatch:
  push:
    branches:
      - proposal/stockfish-multipv-human-training-v1
    paths-ignore:
      - '**/*.md'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify local Java rules and human probabilistic policy
        run: |
          set -euo pipefail
          mkdir -p build/chess-test-classes
          javac -d build/chess-test-classes             app/src/main/java/fr/gambitdrame/ChessGame.java             app/src/main/java/fr/gambitdrame/HumanPolicy.java             app/src/test/java/fr/gambitdrame/ChessGameTest.java             app/src/test/java/fr/gambitdrame/HumanPolicyTest.java app/src/main/java/fr/gambitdrame/ReviewCursor.java app/src/main/java/fr/gambitdrame/EvaluationScale.java app/src/test/java/fr/gambitdrame/ReviewTest.java app/src/main/java/fr/gambitdrame/ChessNarration.java app/src/test/java/fr/gambitdrame/ChessNarrationTest.java app/src/main/java/fr/gambitdrame/StockfishPrecision.java app/src/main/java/fr/gambitdrame/TacticalGuard.java app/src/test/java/fr/gambitdrame/StockfishPrecisionTest.java app/src/test/java/fr/gambitdrame/TacticalGuardTest.java app/src/main/java/fr/gambitdrame/BoardArrows.java app/src/test/java/fr/gambitdrame/BoardArrowsTest.java
          java -cp build/chess-test-classes fr.gambitdrame.ChessGameTest
          java -cp build/chess-test-classes fr.gambitdrame.HumanPolicyTest
          java -cp build/chess-test-classes fr.gambitdrame.ReviewTest
          java -cp build/chess-test-classes fr.gambitdrame.ChessNarrationTest
          java -cp build/chess-test-classes fr.gambitdrame.StockfishPrecisionTest
          java -cp build/chess-test-classes fr.gambitdrame.TacticalGuardTest
          java -cp build/chess-test-classes fr.gambitdrame.BoardArrowsTest
      - name: Install Android SDK and NDK r27c
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Compile official GPLv3 Stockfish 18 for arm64-v8a
        run: |
          set -euo pipefail
          git clone --depth 1 --branch sf_18 https://github.com/official-stockfish/Stockfish.git upstream-stockfish
          test "$(git -C upstream-stockfish rev-parse HEAD)" = "cb3d4ee9b47d0c5aae855b12379378ea1439675c"
          NDKBIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDKBIN/aarch64-linux-android29-clang++"
          export PATH="$NDKBIN:$PATH"
          make -C upstream-stockfish/src net
          make -C upstream-stockfish/src -j2 build ARCH=armv8 COMP=ndk
          test -s upstream-stockfish/src/stockfish
          file upstream-stockfish/src/stockfish
          "$NDKBIN/llvm-strip" upstream-stockfish/src/stockfish
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/licenses
          cp upstream-stockfish/src/stockfish app/src/main/jniLibs/arm64-v8a/libstockfish.so
          cp upstream-stockfish/Copying.txt app/src/main/assets/licenses/STOCKFISH-GPLv3.txt
          cat > app/src/main/assets/licenses/STOCKFISH-SOURCE.txt <<'NOTICE'
          Stockfish 18 — GPL version 3
          Source code matching this unmodified engine binary:
          https://github.com/official-stockfish/Stockfish/tree/cb3d4ee9b47d0c5aae855b12379378ea1439675c
          Source archive:
          https://github.com/official-stockfish/Stockfish/archive/cb3d4ee9b47d0c5aae855b12379378ea1439675c.tar.gz
          Build: make -C src net; make -C src -j2 build ARCH=armv8 COMP=ndk
          Toolchain: Android NDK r27c (27.2.12479018), aarch64 API 29.
          Stockfish is independent and receives UCI commands over a process pipe.
          The engine is used both for independent position analysis and for the optional precision-controlled Stockfish opponent.
          NOTICE
      - name: Download and verify Sherpa-ONNX Android neural TTS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            -o app/libs/sherpa-onnx-1.13.8.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -
          test -s app/libs/sherpa-onnx-1.13.8.aar
      - name: Download and verify French Piper UPMC neural model
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl --fail --location --retry 3 \
            -o "$tmp/upmc-medium.tar.bz2" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-upmc-medium.tar.bz2"
          echo "e9830a331a16f6cc5ef3116a287065e015d3495c3f56b974889a266da7f89a7f  $tmp/upmc-medium.tar.bz2" | sha256sum -c -
          tar -xjf "$tmp/upmc-medium.tar.bz2" -C "$tmp"
          mkdir -p app/src/main/assets/tts/piper
          mv "$tmp/vits-piper-fr_FR-upmc-medium" app/src/main/assets/tts/piper/pierre
          test -s app/src/main/assets/tts/piper/pierre/fr_FR-upmc-medium.onnx
          test -s app/src/main/assets/tts/piper/pierre/tokens.txt
          test -d app/src/main/assets/tts/piper/pierre/espeak-ng-data
          mkdir -p app/src/main/assets/licenses
          curl --fail --location --retry 3 \
            -o app/src/main/assets/licenses/SHERPA-ONNX-LICENSE.txt \
            "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.13.8/LICENSE"
          cat > app/src/main/assets/licenses/PIPER-VOICE-SOURCE.txt <<'NOTICE'
          Neural voice: sherpa-onnx v1.13.8, Piper VITS fr_FR-upmc-medium.
          Multi-speaker source archive:
          https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-upmc-medium.tar.bz2
          Fixed archive SHA256: e9830a331a16f6cc5ef3116a287065e015d3495c3f56b974889a266da7f89a7f
          Sherpa AAR source: https://github.com/k2-fsa/sherpa-onnx/tree/v1.13.8
          Voice speaker ID 0 is Jessica, 1 is Pierre.
          Speech generation on CPU fully offline after APK installation.
          NOTICE
          rm -rf "$tmp"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble APK containing real Stockfish binary
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify packaged Stockfish and Piper neural voice
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libstockfish.so'
          unzip -l "$apk" | grep -F 'assets/licenses/STOCKFISH-GPLv3.txt'
          unzip -l "$apk" | grep -F 'assets/licenses/STOCKFISH-SOURCE.txt'
          unzip -l "$apk" | grep -F 'assets/tts/piper/pierre/fr_FR-upmc-medium.onnx'
          unzip -l "$apk" | grep -F 'assets/tts/piper/pierre/tokens.txt'
          unzip -l "$apk" | grep -F 'assets/licenses/SHERPA-ONNX-LICENSE.txt'
          unzip -l "$apk" | grep -F 'assets/licenses/PIPER-VOICE-SOURCE.txt'
      - name: Publish direct test APK in GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk GambitDrame-v0.4.3-debug-arm64.apk
          tag="gd-test-${{ github.run_number }}"
          gh release create "$tag" GambitDrame-v0.4.3-debug-arm64.apk             --target "${{ github.sha }}" --prerelease             --title "GambitDrame 0.4.3 experimental test ${{ github.run_number }}"             --notes "Depth11 gauge extended to depth12 on same UCI process and hash, full legal MultiPV, tactical centipawn loss cap checkbox, narrow predictive overlaid gauge, regression for queen sacrifice, persistent GET ERR, wooden pieces and fullscreen arrows. GPL source and Sherpa ONNX. Unverified Samsung hardware. No main merge."
