plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'fr.gambitdrame'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.gambitdrame'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '0.3.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

kotlinOptions { jvmTarget = '17' }

dependencies {
    // Neural voice runtime is fetched with fixed SHA-256 by GitHub Actions.
    implementation files('libs/sherpa-onnx-1.13.8.aar')
}
