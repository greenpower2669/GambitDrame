plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.gambitdrame.app'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.gambitdrame.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
